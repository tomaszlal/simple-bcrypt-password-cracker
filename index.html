<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator Haszy Bcrypt</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Biblioteka bcryptjs z CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
  </head>
  <body>
    <div class="container">
        <h2>Generator Haszy Bcrypt</h2>
        
        <div class="input-group">
            <label for="passwordInput">Wpisz hasło:</label>
            <input type="text" id="passwordInput" placeholder="np. TajneHaslo123">
        </div>

        <button id="hashButton" onclick="hashPassword()">Zahaszuj hasło</button>

        <div class="result-group">
            <label>Wynik (Hash Bcrypt):</label>
            <div id="resultBox" class="result-box">Tutaj pojawi się wynik...</div>
        </div>
        <script src="main.js"></script>
    </div>
  </body>
</html>
